manifest:
  version: '0.0'

  remotes:
  - name: github
    url-base: https://github.com/

  projects:
  - name: cxxopts
    repo-path: jarro2783/cxxopts.git
    dst: cxxopts/src
    tag: v3.3.1
    ignore:
      - .*
      - BUILD.bazel
      - CHANGELOG.md
      - CMakeLists.txt
      - INSTALL
      - WORKSPACE
      - cmake
      - include/CMakeLists.txt
      - packaging
      - src
      - test

  - name: doctest
    repo-path: doctest/doctest.git
    dst: doctest/src
    tag: v2.5.2
